<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 186" width="920" height="186" role="img" aria-label="Recognition: 3rd place at the Agents at Work hackathon, Galactic Problem Solver at NASA Space Apps 2026, Best Squad at Banque Misr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171030"/></linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D28D9" stop-opacity=".5"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 3.5px; fill: #A78BFA; }
    .when { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; fill: #A78BFA; font-family: 'Consolas','Courier New',monospace; }
    .ttl { font-size: 20px; font-weight: 700; fill: #fff; }
    .ttlh { font-size: 20px; font-weight: 700; fill: url(#grad); }
    .sub { font-size: 14px; fill: #bdb7d9; }
    .s { opacity: 0; animation: rise .7s ease-out forwards; }
    .s1 { animation-delay: .2s; } .s2 { animation-delay: .5s; } .s3 { animation-delay: .8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <rect width="920" height="186" rx="16" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="918.5" height="184.5" rx="15.5" fill="none" stroke="#A78BFA" stroke-opacity=".3" stroke-width="1.5"/>
  <text class="eyebrow" x="40" y="48">RECOGNITION</text>
  <line x1="40" y1="76" x2="880" y2="76" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <g class="s s1">
    <circle cx="44" cy="76" r="6" fill="#0d1117" stroke="#A78BFA" stroke-width="2"/>
    <text class="when" x="40" y="108">AGENTS AT WORK · HACKATHON</text>
    <text class="ttl" x="40" y="136">3rd place</text>
    <text class="sub" x="40" y="158">Solo entry</text>
  </g>
  <g class="s s2">
    <circle cx="350" cy="76" r="11" fill="#A78BFA" fill-opacity=".2"/><circle cx="350" cy="76" r="6" fill="#C4B5FD"/>
    <text class="when" x="346" y="108" style="fill:#F0ABFC">NASA SPACE APPS · 2026</text>
    <text class="ttlh" x="346" y="136">Galactic Problem Solver</text>
    <text class="sub" x="346" y="158">Team AstroSpark</text>
  </g>
  <g class="s s3">
    <circle cx="656" cy="76" r="6" fill="#0d1117" stroke="#A78BFA" stroke-width="2"/>
    <text class="when" x="652" y="108">BANQUE MISR</text>
    <text class="ttl" x="652" y="136">Best Squad</text>
    <text class="sub" x="652" y="158">Data Governance program</text>
  </g>
</svg>
