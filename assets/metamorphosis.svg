<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 462" width="920" height="462" role="img" aria-labelledby="t d">
  <title id="t">My story: I wrote my first line of code in elementary school and have been building ever since</title>
  <desc id="d">A four-step timeline: elementary school, 2023 to 2025, 2025, and November 2025 to now.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#171030"/></linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D28D9" stop-opacity=".5"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 3.5px; fill: #A78BFA; }
    .h1 { font-size: 29px; font-weight: 700; fill: #fff; }
    .h2 { font-size: 29px; font-weight: 700; fill: url(#grad); }
    .when { font-size: 11px; font-weight: 600; letter-spacing: 1.6px; fill: #A78BFA; font-family: 'Consolas','Courier New',monospace; }
    .ttl { font-size: 17px; font-weight: 700; fill: #fff; }
    .body { font-size: 14px; fill: #bdb7d9; }
    .num { font-size: 26px; font-weight: 700; fill: url(#grad); }
    .lbl { font-size: 12px; fill: #9a95b8; }
    .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.8s ease-out .2s forwards; }
    .s { opacity: 0; animation: rise .7s ease-out forwards; }
    .s1 { animation-delay: .3s; } .s2 { animation-delay: .6s; } .s3 { animation-delay: .9s; } .s4 { animation-delay: 1.2s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
  </style>

  <rect width="920" height="462" rx="16" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="918.5" height="460.5" rx="15.5" fill="none" stroke="#A78BFA" stroke-opacity=".3" stroke-width="1.5"/>

  <!-- faint line-art butterfly watermark -->
  <g transform="translate(822 92) scale(1.5)" fill="none" stroke="#A78BFA" stroke-opacity=".28" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 -2 C-8 -34 -50 -40 -54 -16 C-56 4 -22 8 0 -2Z"/><path d="M0 2 C-16 6 -40 18 -32 36 C-26 46 -8 30 0 10Z"/>
    <path d="M0 -2 C8 -34 50 -40 54 -16 C56 4 22 8 0 -2Z"/><path d="M0 2 C16 6 40 18 32 36 C26 46 8 30 0 10Z"/>
    <path d="M0 -14 L0 16"/><path d="M-1 -14 C-4 -24 -9 -27 -13 -28 M1 -14 C4 -24 9 -27 13 -28"/>
  </g>

  <text class="eyebrow" x="40" y="50">MY STORY</text>
  <text class="h1" x="40" y="94">I wrote my first line of code in elementary school.</text>
  <text class="h2" x="40" y="132">I've been building ever since.</text>

  <!-- timeline -->
  <line x1="40" y1="234" x2="880" y2="234" stroke="#A78BFA" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
  <line class="draw" x1="40" y1="234" x2="880" y2="234" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

  <g class="s s1">
    <text class="when" x="40" y="212">ELEMENTARY SCHOOL</text>
    <circle cx="44" cy="234" r="6" fill="#0d1117" stroke="#A78BFA" stroke-width="2"/>
    <text class="ttl" x="40" y="274">First line of code</text>
    <text class="body" x="40" y="302">Taught myself JavaScript,</text>
    <text class="body" x="40" y="322">before it was even a</text>
    <text class="body" x="40" y="342">school subject.</text>
  </g>
  <g class="s s2">
    <text class="when" x="262" y="212">2023 – 2025</text>
    <circle cx="266" cy="234" r="6" fill="#0d1117" stroke="#A78BFA" stroke-width="2"/>
    <text class="ttl" x="262" y="274">AI + ALX Africa</text>
    <text class="body" x="262" y="302">AI degree at ERU, plus</text>
    <text class="body" x="262" y="322">ALX Software Engineering:</text>
    <text class="body" x="262" y="342">full-stack, C and DevOps.</text>
  </g>
  <g class="s s3">
    <text class="when" x="484" y="212">2025</text>
    <circle cx="488" cy="234" r="6" fill="#0d1117" stroke="#A78BFA" stroke-width="2"/>
    <text class="ttl" x="484" y="274">Software, for real</text>
    <text class="body" x="484" y="302">Moved to El Sewedy</text>
    <text class="body" x="484" y="322">University of Technology,</text>
    <text class="body" x="484" y="342">shipped Bagi Job freelance.</text>
  </g>
  <g class="s s4">
    <text class="when" x="706" y="212" style="fill:#F0ABFC">NOV 2025 – NOW</text>
    <circle cx="710" cy="234" r="11" fill="#A78BFA" fill-opacity=".2"/>
    <circle cx="710" cy="234" r="6" fill="#C4B5FD"/>
    <text class="ttl" x="706" y="274">Building &amp; recognised</text>
    <text class="body" x="706" y="302">Co-founder, LM Smart</text>
    <text class="body" x="706" y="322">Solutions. NASA Space Apps</text>
    <text class="body" x="706" y="342">certificate, 3rd at Agents at Work</text>
  </g>
  <g class="s s4" style="animation-delay:1.5s">
    <line x1="40" y1="376" x2="880" y2="376" stroke="#A78BFA" stroke-opacity=".2"/>
    <text class="num" x="40" y="418">6,200+</text>
    <text class="lbl" x="40" y="438">GitHub contributions since 2021</text>
    <text class="num" x="262" y="418">7+</text>
    <text class="lbl" x="262" y="438">projects built</text>
    <text class="num" x="484" y="418">3</text>
    <text class="lbl" x="484" y="438">awards &amp; recognitions</text>
    <text class="num" x="706" y="418">2027</text>
    <text class="lbl" x="706" y="438">expected graduation</text>
  </g>
</svg>
