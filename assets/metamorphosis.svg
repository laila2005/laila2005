<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="t d">
  <title id="t">My story: I wrote my first line of code in elementary school and have been metamorphosing ever since</title>
  <desc id="d">Four stages shown as an egg, a caterpillar, a chrysalis and a butterfly: the spark in elementary school, learning by doing 2023 to 2025, finding my field in 2025, and taking flight from November 2025.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1038"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <g id="wingshape">
      <path d="M0 -2 C-8 -34 -50 -40 -54 -16 C-56 4 -22 8 0 -2Z" fill="url(#wing)" fill-opacity=".92" stroke="#EDE9FE" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0 2 C-16 6 -40 18 -32 36 C-26 46 -8 30 0 10Z" fill="url(#wing)" fill-opacity=".75" stroke="#EDE9FE" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="-32" cy="-17" r="5" fill="#6D28D9" fill-opacity=".55"/>
      <circle cx="-20" cy="22" r="3.4" fill="#6D28D9" fill-opacity=".55"/>
    </g>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 4px; fill: #A78BFA; }
    .h1    { font-size: 29px; font-weight: 700; fill: #ffffff; }
    .h2    { font-size: 29px; font-weight: 700; fill: url(#grad); }
    .stage { font-size: 11.5px; font-weight: 700; letter-spacing: 2px; fill: #C4B5FD; }
    .when  { font-size: 12px; font-weight: 600; letter-spacing: 1px; fill: #9a95b8; font-family: 'Consolas','Courier New',monospace; }
    .ttl   { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .body  { font-size: 14px; fill: #d6d0f0; }

    .draw  { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 3.2s ease-out .3s forwards; }
    .s     { opacity: 0; animation: rise .8s ease-out forwards; }
    .s0 { animation-delay: 0s; } .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.2s; }
    .s3 { animation-delay: 1.9s; } .s4 { animation-delay: 2.6s; }
    .flap  { transform-origin: 0 0; animation: flap .9s ease-in-out infinite; }
    .sway  { transform-origin: 0 -24px; animation: sway 3s ease-in-out infinite; }
    .bob   { animation: bob 3.4s ease-in-out infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 0 0; }
    .star  { animation: tw 3s ease-in-out infinite; }

    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flap  { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.5); } }
    @keyframes sway  { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: .5; } }
    @keyframes tw    { 0%,100% { opacity: .15; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
    }
  </style>

  <rect width="920" height="520" rx="20" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="918.5" height="518.5" rx="19.5" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- stars -->
  <g fill="#EDE9FE">
    <circle class="star" cx="860" cy="40" r="1.5"/><circle class="star" cx="780" cy="70" r="1.1" style="animation-delay:.8s"/>
    <circle class="star" cx="880" cy="110" r="1.3" style="animation-delay:1.6s"/><circle class="star" cx="640" cy="34" r="1.1" style="animation-delay:.4s"/>
    <circle class="star" cx="470" cy="160" r="1.2" style="animation-delay:2.2s"/><circle class="star" cx="36" cy="200" r="1.2" style="animation-delay:1.2s"/>
    <circle class="star" cx="896" cy="230" r="1.1" style="animation-delay:2s"/>
  </g>

  <!-- headline -->
  <g class="s s0">
    <text class="eyebrow" x="40" y="48">MY STORY</text>
    <text class="h1" x="40" y="92">I wrote my first line of code in elementary school.</text>
    <text class="h2" x="40" y="130">I've been metamorphosing ever since.</text>
  </g>

  <!-- the path: faint dashed track, ink drawn on top -->
  <path d="M40 262 C90 262 90 250 136 250 C210 250 280 226 352 226 C430 226 495 250 568 250 C645 250 715 214 784 214 C840 214 880 200 900 192"
        fill="none" stroke="#A78BFA" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 7"/>
  <path class="draw" d="M40 262 C90 262 90 250 136 250 C210 250 280 226 352 226 C430 226 495 250 568 250 C645 250 715 214 784 214 C840 214 880 200 900 192"
        fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>

  <!-- connectors -->
  <g stroke="#A78BFA" stroke-opacity=".3" stroke-dasharray="3 5" stroke-width="1.5">
    <line x1="136" y1="288" x2="136" y2="320"/><line x1="352" y1="264" x2="352" y2="320"/>
    <line x1="568" y1="288" x2="568" y2="320"/><line x1="784" y1="260" x2="784" y2="320"/>
  </g>

  <!-- 1 egg -->
  <g class="s s1">
    <g transform="translate(136 250)">
      <circle r="34" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="3 4"/>
      <g class="bob">
        <ellipse cx="0" cy="2" rx="14" ry="19" fill="#EDE9FE" fill-opacity=".14" stroke="#C4B5FD" stroke-width="2"/>
        <path d="M-8 -3 L-4 -8 L0 -2 L4 -9 L8 -3" fill="none" stroke="#C4B5FD" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 2 caterpillar -->
  <g class="s s2">
    <g transform="translate(352 226)">
      <circle r="34" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="3 4"/>
      <g class="bob" style="animation-delay:.4s">
        <g fill="#A78BFA" fill-opacity=".3" stroke="#C4B5FD" stroke-width="2">
          <circle cx="-22" cy="9" r="7"/><circle cx="-7" cy="5" r="7"/><circle cx="8" cy="5" r="7"/>
          <circle cx="21" cy="-1" r="9" fill-opacity=".5"/>
        </g>
        <circle cx="24" cy="-3" r="1.6" fill="#fff"/>
        <path d="M19 -9 C18 -14 15 -16 12 -17 M25 -9 C27 -14 30 -16 33 -17" fill="none" stroke="#C4B5FD" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 3 chrysalis -->
  <g class="s s3">
    <g transform="translate(568 250)">
      <circle r="34" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="3 4"/>
      <line x1="0" y1="-30" x2="0" y2="-22" stroke="#C4B5FD" stroke-width="2"/>
      <g class="sway">
        <path d="M0 -22 C-15 -13 -15 14 0 29 C15 14 15 -13 0 -22Z" fill="#A78BFA" fill-opacity=".3" stroke="#C4B5FD" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-10 -2 C-4 2 4 2 10 -2 M-9 7 C-4 11 4 11 9 7" fill="none" stroke="#EDE9FE" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 4 butterfly -->
  <g class="s s4">
    <g transform="translate(784 214)">
      <circle class="pulse" r="56" fill="url(#glow)"/>
      <g class="bob" style="animation-delay:.2s">
        <g transform="scale(1.05)">
          <g class="flap"><use href="#wingshape"/></g>
          <g transform="scale(-1 1)"><g class="flap"><use href="#wingshape"/></g></g>
          <ellipse cx="0" cy="2" rx="2.8" ry="16" fill="#EDE9FE"/>
          <path d="M-1 -14 C-4 -24 -9 -27 -13 -28 M1 -14 C4 -24 9 -27 13 -28" fill="none" stroke="#EDE9FE" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- cards -->
  <g class="s s1">
    <rect x="36" y="320" width="200" height="176" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#A78BFA" stroke-opacity=".35"/>
    <text class="stage" x="136" y="348" text-anchor="middle">THE SPARK</text>
    <text class="when" x="136" y="366" text-anchor="middle">ELEMENTARY SCHOOL</text>
    <text class="ttl" x="136" y="394" text-anchor="middle">First line of code</text>
    <text class="body" x="136" y="420" text-anchor="middle">Taught myself JavaScript,</text>
    <text class="body" x="136" y="440" text-anchor="middle">before it was even a</text>
    <text class="body" x="136" y="460" text-anchor="middle">school subject.</text>
  </g>
  <g class="s s2">
    <rect x="252" y="320" width="200" height="176" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#A78BFA" stroke-opacity=".35"/>
    <text class="stage" x="352" y="348" text-anchor="middle">LEARNING BY DOING</text>
    <text class="when" x="352" y="366" text-anchor="middle">2023 – 2025</text>
    <text class="ttl" x="352" y="394" text-anchor="middle">AI + ALX Africa</text>
    <text class="body" x="352" y="420" text-anchor="middle">AI degree at ERU, plus</text>
    <text class="body" x="352" y="440" text-anchor="middle">ALX Software Engineering:</text>
    <text class="body" x="352" y="460" text-anchor="middle">full-stack, C and DevOps.</text>
  </g>
  <g class="s s3">
    <rect x="468" y="320" width="200" height="176" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#A78BFA" stroke-opacity=".35"/>
    <text class="stage" x="568" y="348" text-anchor="middle">FINDING MY FIELD</text>
    <text class="when" x="568" y="366" text-anchor="middle">2025</text>
    <text class="ttl" x="568" y="394" text-anchor="middle">Software, for real</text>
    <text class="body" x="568" y="420" text-anchor="middle">Moved to El Sewedy</text>
    <text class="body" x="568" y="440" text-anchor="middle">University of Technology,</text>
    <text class="body" x="568" y="460" text-anchor="middle">shipped Bagi Job freelance.</text>
  </g>
  <g class="s s4">
    <rect x="684" y="320" width="200" height="176" rx="14" fill="#A78BFA" fill-opacity=".12" stroke="#C4B5FD" stroke-opacity=".7" stroke-width="1.5"/>
    <text class="stage" x="784" y="348" text-anchor="middle">TAKING FLIGHT</text>
    <text class="when" x="784" y="366" text-anchor="middle">NOV 2025 – NOW</text>
    <text class="ttl" x="784" y="394" text-anchor="middle">Building &amp; recognised</text>
    <text class="body" x="784" y="420" text-anchor="middle">Co-founder, LM Smart</text>
    <text class="body" x="784" y="440" text-anchor="middle">Solutions. NASA Space Apps</text>
    <text class="body" x="784" y="460" text-anchor="middle">award, 3rd at Agents at Work</text>
    <text class="when" x="784" y="484" text-anchor="middle" style="fill:#C4B5FD">GRADUATING 2027</text>
  </g>
</svg>
