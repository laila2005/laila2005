<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">The metamorphosis: Laila's path from first line of code to co-founder</title>
  <desc id="d">Four stages shown as an egg, a caterpillar, a chrysalis and a butterfly: the spark in elementary school, learning by doing 2023 to 2025, finding my field in 2025, and taking flight from November 2025.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1038"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <g id="wingshape">
      <path d="M0 -2 C-8 -34 -50 -40 -54 -16 C-56 4 -22 8 0 -2Z" fill="url(#wing)" fill-opacity=".92" stroke="#EDE9FE" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0 2 C-16 6 -40 18 -32 36 C-26 46 -8 30 0 10Z" fill="url(#wing)" fill-opacity=".75" stroke="#EDE9FE" stroke-width="1.4" stroke-linejoin="round"/>
      <circle cx="-32" cy="-17" r="5" fill="#6D28D9" fill-opacity=".55"/>
      <circle cx="-20" cy="22" r="3.4" fill="#6D28D9" fill-opacity=".55"/>
    </g>
  </defs>

  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .stage { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #C4B5FD; }
    .when  { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: #8b86a8; font-family: 'Consolas','Courier New',monospace; }
    .ttl   { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .body  { font-size: 12.5px; fill: #cfc9ea; }
    .head  { font-size: 13px; font-weight: 700; letter-spacing: 3px; fill: #A78BFA; }

    .draw  { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 3.2s ease-out .3s forwards; }
    .s     { opacity: 0; animation: rise .8s ease-out forwards; }
    .s1 { animation-delay: .3s; } .s2 { animation-delay: 1.1s; }
    .s3 { animation-delay: 1.9s; } .s4 { animation-delay: 2.7s; }
    .flap  { transform-origin: 0 0; animation: flap .9s ease-in-out infinite; }
    .sway  { transform-origin: 0 -26px; animation: sway 3s ease-in-out infinite; }
    .bob   { animation: bob 3.4s ease-in-out infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 0 0; }
    .star  { animation: tw 3s ease-in-out infinite; }

    @keyframes draw  { to { stroke-dashoffset: 0; } }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes flap  { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.5); } }
    @keyframes sway  { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bob   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: .5; } }
    @keyframes tw    { 0%,100% { opacity: .15; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
    }
  </style>

  <rect width="960" height="440" rx="20" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="958.5" height="438.5" rx="19.5" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- stars -->
  <g fill="#EDE9FE">
    <circle class="star" cx="70" cy="40" r="1.4"/><circle class="star" cx="260" cy="26" r="1.1" style="animation-delay:.8s"/>
    <circle class="star" cx="470" cy="46" r="1.5" style="animation-delay:1.6s"/><circle class="star" cx="690" cy="28" r="1.1" style="animation-delay:.4s"/>
    <circle class="star" cx="900" cy="52" r="1.4" style="animation-delay:2.2s"/><circle class="star" cx="560" cy="170" r="1" style="animation-delay:1.2s"/>
    <circle class="star" cx="40" cy="180" r="1.2" style="animation-delay:2s"/><circle class="star" cx="925" cy="170" r="1.1" style="animation-delay:.6s"/>
  </g>

  <text class="head" x="45" y="44">THE METAMORPHOSIS</text>

  <!-- the path: faint dashed track, ink drawn on top -->
  <path d="M45 150 C110 150 100 128 150 128 C215 128 300 104 375 104 C450 104 525 128 600 128 C675 128 750 100 825 100 C880 100 910 88 935 80"
        fill="none" stroke="#A78BFA" stroke-opacity=".25" stroke-width="2" stroke-dasharray="6 7"/>
  <path class="draw" d="M45 150 C110 150 100 128 150 128 C215 128 300 104 375 104 C450 104 525 128 600 128 C675 128 750 100 825 100 C880 100 910 88 935 80"
        fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"/>

  <!-- connectors -->
  <g stroke="#A78BFA" stroke-opacity=".3" stroke-dasharray="3 5" stroke-width="1.5">
    <line x1="150" y1="170" x2="150" y2="214"/><line x1="375" y1="146" x2="375" y2="214"/>
    <line x1="600" y1="172" x2="600" y2="214"/><line x1="825" y1="150" x2="825" y2="214"/>
  </g>

  <!-- 1 egg -->
  <g class="s s1">
    <g transform="translate(150 128)">
      <circle r="38" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="3 4"/>
      <g class="bob">
        <ellipse cx="0" cy="2" rx="15" ry="21" fill="#EDE9FE" fill-opacity=".14" stroke="#C4B5FD" stroke-width="2"/>
        <path d="M-9 -4 L-4 -9 L0 -3 L5 -10 L9 -4" fill="none" stroke="#C4B5FD" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 2 caterpillar -->
  <g class="s s2">
    <g transform="translate(375 104)">
      <circle r="38" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="3 4"/>
      <g class="bob" style="animation-delay:.4s">
        <g fill="#A78BFA" fill-opacity=".3" stroke="#C4B5FD" stroke-width="2">
          <circle cx="-24" cy="10" r="8"/><circle cx="-8" cy="6" r="8"/><circle cx="8" cy="6" r="8"/>
          <circle cx="23" cy="0" r="10" fill-opacity=".5"/>
        </g>
        <circle cx="26" cy="-2" r="1.8" fill="#fff"/>
        <path d="M21 -9 C20 -15 17 -17 14 -18 M27 -9 C29 -15 32 -17 35 -18" fill="none" stroke="#C4B5FD" stroke-width="1.7" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 3 chrysalis -->
  <g class="s s3">
    <g transform="translate(600 128)">
      <circle r="38" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".5" stroke-dasharray="3 4"/>
      <line x1="0" y1="-34" x2="0" y2="-24" stroke="#C4B5FD" stroke-width="2"/>
      <g class="sway">
        <path d="M0 -24 C-17 -14 -17 16 0 32 C17 16 17 -14 0 -24Z" fill="#A78BFA" fill-opacity=".3" stroke="#C4B5FD" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-11 -2 C-4 2 4 2 11 -2 M-10 8 C-4 12 4 12 10 8" fill="none" stroke="#EDE9FE" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 4 butterfly -->
  <g class="s s4">
    <g transform="translate(825 100)">
      <circle class="pulse" r="58" fill="url(#glow)"/>
      <g class="bob" style="animation-delay:.2s">
        <g transform="scale(1.1)">
          <g class="flap"><use href="#wingshape"/></g>
          <g transform="scale(-1 1)"><g class="flap"><use href="#wingshape"/></g></g>
          <ellipse cx="0" cy="2" rx="2.8" ry="16" fill="#EDE9FE"/>
          <path d="M-1 -14 C-4 -24 -9 -27 -13 -28 M1 -14 C4 -24 9 -27 13 -28" fill="none" stroke="#EDE9FE" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- cards -->
  <g class="s s1">
    <rect x="45" y="214" width="210" height="190" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#A78BFA" stroke-opacity=".35"/>
    <text class="stage" x="150" y="244" text-anchor="middle">THE SPARK</text>
    <text class="when" x="150" y="262" text-anchor="middle">ELEMENTARY SCHOOL</text>
    <text class="ttl" x="150" y="292" text-anchor="middle">First line of code</text>
    <text class="body" x="150" y="319" text-anchor="middle">Taught myself JavaScript:</text>
    <text class="body" x="150" y="338" text-anchor="middle">console.log("Hello, World")</text>
    <text class="body" x="150" y="357" text-anchor="middle">It wasn't even a subject.</text>
  </g>
  <g class="s s2">
    <rect x="270" y="214" width="210" height="190" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#A78BFA" stroke-opacity=".35"/>
    <text class="stage" x="375" y="244" text-anchor="middle">LEARNING BY DOING</text>
    <text class="when" x="375" y="262" text-anchor="middle">2023 – 2025</text>
    <text class="ttl" x="375" y="292" text-anchor="middle">AI degree + ALX Africa</text>
    <text class="body" x="375" y="319" text-anchor="middle">Egyptian Russian University,</text>
    <text class="body" x="375" y="338" text-anchor="middle">plus ALX Software Engineering:</text>
    <text class="body" x="375" y="357" text-anchor="middle">full-stack, C and DevOps.</text>
  </g>
  <g class="s s3">
    <rect x="495" y="214" width="210" height="190" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#A78BFA" stroke-opacity=".35"/>
    <text class="stage" x="600" y="244" text-anchor="middle">FINDING MY FIELD</text>
    <text class="when" x="600" y="262" text-anchor="middle">2025</text>
    <text class="ttl" x="600" y="292" text-anchor="middle">Software, for real</text>
    <text class="body" x="600" y="319" text-anchor="middle">Moved to El Sewedy University</text>
    <text class="body" x="600" y="338" text-anchor="middle">of Technology and shipped</text>
    <text class="body" x="600" y="357" text-anchor="middle">Bagi Job as a freelancer.</text>
  </g>
  <g class="s s4">
    <rect x="720" y="214" width="210" height="190" rx="14" fill="#A78BFA" fill-opacity=".1" stroke="#C4B5FD" stroke-opacity=".7" stroke-width="1.5"/>
    <text class="stage" x="825" y="244" text-anchor="middle">TAKING FLIGHT</text>
    <text class="when" x="825" y="262" text-anchor="middle">NOV 2025 – NOW</text>
    <text class="ttl" x="825" y="292" text-anchor="middle">Building, and recognised</text>
    <text class="body" x="825" y="319" text-anchor="middle">Co-founder, LM Smart Solutions</text>
    <text class="body" x="825" y="338" text-anchor="middle">NASA Space Apps 2026 award,</text>
    <text class="body" x="825" y="357" text-anchor="middle">3rd place at Agents at Work.</text>
    <text class="when" x="825" y="385" text-anchor="middle" style="fill:#C4B5FD">GRADUATING 2027</text>
  </g>

  <text x="480" y="428" text-anchor="middle" style="font-size:11px;fill:#6f6a8c;letter-spacing:1px">EGG  →  CATERPILLAR  →  CHRYSALIS  →  BUTTERFLY</text>
</svg>
